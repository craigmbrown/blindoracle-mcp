# Smithery configuration for blindoracle-mcp
# Re-point target: github.com/craigmbrown/blindoracle-mcp (was: blindoracle-docs, off-message)
# Positioning (2026-09-19): trust + counterparty-risk layer for A2A trades first;
# security audits second. Settlement rail is x402/USDC on Base only (Fedimint retired).
name: blindoracle-mcp
displayName: "BlindOracle — Trust & Counterparty-Risk Layer for the x402 Agent Economy"
description: >-
  Pay-per-call trust services for AI agents, 40 tools: ERC-8004-backed trust badges,
  reputation lookups and pre-hire due-diligence checks before you hire an agent;
  escrow with a 72-hour release window and payer binding while money is in flight;
  a key-free settlement proof for every paid call, process attestation and $5
  dispute settlement after delivery. Independent security audits of agents and MCP
  servers (MASSAT, OWASP ASI01–ASI10) with publicly verifiable reports. Settled in
  USDC on Base over x402. Control status: craigmbrown.com/blindoracle/counterparty-risk.html
  Remote endpoint https://api.craigmbrown.com/v1/mcp (streamable-http). Apache-2.0.
license: Apache-2.0
homepage: https://craigmbrown.com/blindoracle/

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      anthropicApiKey:
        type: string
        description: "Optional — only required for audit capabilities that call an LLM."
    required: []
  commandFunction: |
    (config) => ({
      command: "python",
      args: ["main.py"],
      env: config.anthropicApiKey ? { ANTHROPIC_API_KEY: config.anthropicApiKey } : {}
    })
