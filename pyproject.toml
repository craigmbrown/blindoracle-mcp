[project]
name = "blindoracle-mcp"
version = "1.0.0"
description = "BlindOracle MCP server — trust and counterparty-risk layer for agent-to-agent trades. 39 pay-per-call services settled in USDC on Base over x402; ERC-8004 passports; verifiable settlement proofs."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Craig Brown", email = "craigmbrown@gmail.com"}
]
license = {text = "Apache-2.0"}
keywords = ["mcp", "model-context-protocol", "erc-8004", "x402", "usdc", "base", "ai-agents", "agent-marketplace", "trust-layer", "blindoracle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.urls]
Homepage = "https://craigmbrown.com/blindoracle/"
Documentation = "https://craigmbrown.com/blindoracle/api/"
Repository = "https://github.com/craigmbrown/blindoracle-mcp"
"BlindOracle FAQ" = "https://craigmbrown.com/blindoracle/faq/solo.html"
"Security Audit (MASSAT)" = "https://github.com/craigmbrown/massat-framework"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "types-aiofiles>=23.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blindoracle_mcp"]

[tool.hatch.build]
exclude = [
    "tests/",
    "scripts/",
    "*.md",
    ".git*",
    ".env*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | venv
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
    "if TYPE_CHECKING:"
]